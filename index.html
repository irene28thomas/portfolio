  <!-- Layout Mode & Cursor Capability Detection -->
  <script>
    (function () {
      var root = document.documentElement;
      var mqPrimary = window.matchMedia('(hover: none) and (pointer: coarse) and ((max-width: 599px) or (max-height: 599px))');
      var mqFallback = window.matchMedia('(hover: none) and (pointer: coarse) and (max-width: 599px), (hover: none) and (pointer: coarse) and (max-height: 599px)');
      var mqLayout = (mqPrimary && mqPrimary.media !== 'not all') ? mqPrimary : mqFallback;
      var mqCursor = window.matchMedia('(hover: hover) and (pointer: fine)');

      function applyLayoutMode() {
        var isMobile = Boolean((mqLayout && mqLayout.matches) || (mqFallback && mqFallback.matches));
        var mode = isMobile ? 'mobile' : 'desktop';
        var prev = root.getAttribute('data-mode');
        root.setAttribute('data-mode', mode);
        if (prev && prev !== mode) {
          window.dispatchEvent(new CustomEvent('atelier:modechange', { detail: { mode: mode, isMobile: isMobile } }));
        }
      }

      function applyCursorMode() {
        var hasFineHover = Boolean(mqCursor && mqCursor.matches);
        root.setAttribute('data-cursor', hasFineHover ? 'fine' : 'none');
        window.dispatchEvent(new CustomEvent('atelier:cursorchange', { detail: { hasFineHover: hasFineHover } }));
      }

      applyLayoutMode();
      applyCursorMode();

      function bindChange(mq, fn) {
        if (!mq) return;
        if (mq.addEventListener) mq.addEventListener('change', fn);
        else if (mq.addListener) mq.addListener(fn);
      }
      bindChange(mqPrimary, applyLayoutMode);
      if (mqFallback !== mqPrimary) bindChange(mqFallback, applyLayoutMode);
      bindChange(mqCursor, applyCursorMode);

      window.AtelierMode = {
        isMobile: function () { return root.getAttribute('data-mode') === 'mobile'; },
        isDesktop: function () { return root.getAttribute('data-mode') !== 'mobile'; },
        hasFineHover: function () { return Boolean(mqCursor && mqCursor.matches); },
        mqLayout: mqLayout,
        mqCursor: mqCursor
      };
    })();
  </script>

  <!-- DETERMINISTIC VIEW-GATED MODULE LOADER (ZERO INACTIVE SCRIPT OVERHEAD) -->
  <script>
    (function () {
      var activeMode = window.__ATELIER_VIEW__ === 'portrait' ? 'portrait' : 'landscape';
      var viewScripts = activeMode === 'portrait'
        ? [
            'js/portrait/portrait-nav.js?v=20261115v52',
            'js/portrait/portrait-petal-wheel.js?v=20261115v52',
            'js/portrait/portrait-widgets.js?v=20261115v52',

            'js/core/cursor.js',
            'js/core/navigation.js',
            'js/modules/brand-console.js',

            'js/modules/mobile-sheet.js',
            'js/modules/poster-filter.js',
            'js/app.js',
            'js/core/pinned-burn-engine.js'
          ];

      var queuedDcl = [];
      var queuedLoad = [];
      var queueDone = false;
      var origDocAdd = document.addEventListener.bind(document);
      var origWinAdd = window.addEventListener.bind(window);

      document.addEventListener = function (type, fn, opts) {
        if (!queueDone && type === 'DOMContentLoaded' && typeof fn === 'function') {
          queuedDcl.push({ target: document, fn: fn });
          return;
        }
        return origDocAdd(type, fn, opts);
      };

      window.addEventListener = function (type, fn, opts) {
        if (!queueDone && type === 'DOMContentLoaded' && typeof fn === 'function') {
          queuedDcl.push({ target: window, fn: fn });
          return;
        }
        if (!queueDone && type === 'load' && typeof fn === 'function') {
          queuedLoad.push({ target: window, fn: fn });
          return;
        }
        return origWinAdd(type, fn, opts);
      };

      function flushLifecycleQueues() {
        queueDone = true;
        document.addEventListener = origDocAdd;
        window.addEventListener = origWinAdd;

        var runDcl = function () {
          queuedDcl.forEach(function (entry) {
            try { entry.fn.call(entry.target, { type: 'DOMContentLoaded', target: document }); }
            catch (err) { console.error('Atelier DCL init error:', err); }
          });
        };

        var runLoad = function () {
          queuedLoad.forEach(function (entry) {
            try { entry.fn.call(entry.target, { type: 'load', target: window }); }
            catch (err) { console.error('Atelier Load init error:', err); }
          });
        };

        if (document.readyState === 'loading') {
          origDocAdd('DOMContentLoaded', runDcl);
          origWinAdd('load', runLoad);
        } else if (document.readyState === 'interactive') {
          runDcl();
          origWinAdd('load', runLoad);
        } else {
          runDcl();
          runLoad();
        }
      }

      var remaining = viewScripts.length;
      function onScriptDone() {
        remaining -= 1;
        if (remaining <= 0) flushLifecycleQueues();
      }

      viewScripts.forEach(function (src) {
        var s = document.createElement('script');
        s.src = src;
        s.async = false;
        s.onload = onScriptDone;
        s.onerror = onScriptDone;
        document.body.appendChild(s);
      });
    })();
  </script>
